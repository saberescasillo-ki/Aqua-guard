# Compila Aqua Guard BETA para celulares (Android/iPhone) y computadoras (Windows/macOS/Linux).
# Cada instalador se sube a Releases al terminar.
name: Compilar beta

on:
  push:
    branches: ['**']
    paths: ['beta/**', '.github/workflows/build-beta.yml']
  workflow_dispatch:

permissions:
  contents: write

defaults:
  run:
    working-directory: beta

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: beta/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npx cap sync android
      - name: Compilar APK
        working-directory: beta/android
        run: ./gradlew assembleDebug --no-daemon
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk AquaGuardBeta.apk
      - uses: actions/upload-artifact@v4
        with:
          name: beta-android
          path: beta/AquaGuardBeta.apk
      - name: Publicar en Releases
        if: github.ref_name == 'ccr-82416552-hpdgnz' || github.ref_name == 'main'
        shell: bash
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          shopt -s nullglob
          files=(beta/AquaGuardBeta.apk)
          gh release view beta-latest >/dev/null 2>&1 || gh release create beta-latest --prerelease \
            --title "Aqua Guard Beta (última versión)" \
            --notes "Versión BETA. Cada archivo se actualiza en cuanto termina su compilación." || true
          gh release upload beta-latest "${files[@]}" --clobber

  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: beta/package-lock.json
      - run: npm ci
      - run: npx cap sync ios
      - name: Compilar app iOS (sin firmar)
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""
      - name: Empaquetar IPA
        run: |
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/App.app Payload/
          zip -qr AquaGuardBeta-sin-firmar.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: beta-ios
          path: beta/AquaGuardBeta-sin-firmar.ipa
      - name: Publicar en Releases
        if: github.ref_name == 'ccr-82416552-hpdgnz' || github.ref_name == 'main'
        shell: bash
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          shopt -s nullglob
          files=(beta/AquaGuardBeta-sin-firmar.ipa)
          gh release view beta-latest >/dev/null 2>&1 || gh release create beta-latest --prerelease \
            --title "Aqua Guard Beta (última versión)" \
            --notes "Versión BETA. Cada archivo se actualiza en cuanto termina su compilación." || true
          gh release upload beta-latest "${files[@]}" --clobber

  escritorio:
    strategy:
      matrix:
        include:
          - os: windows-latest
            target: --win
          - os: macos-15
            target: --mac
          - os: ubuntu-latest
            target: --linux
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: beta/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: beta/desktop/package-lock.json
      - run: npm ci
      - run: npm run dist -- ${{ matrix.target }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - uses: actions/upload-artifact@v4
        with:
          name: beta-escritorio-${{ runner.os }}
          path: |
            beta/desktop/dist/*.exe
            beta/desktop/dist/*.zip
            beta/desktop/dist/*.AppImage
      - name: Publicar en Releases
        if: github.ref_name == 'ccr-82416552-hpdgnz' || github.ref_name == 'main'
        shell: bash
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          shopt -s nullglob
          files=(beta/desktop/dist/AquaGuardBeta-*.exe beta/desktop/dist/AquaGuardBeta-*.zip beta/desktop/dist/AquaGuardBeta-*.AppImage)
          gh release view beta-latest >/dev/null 2>&1 || gh release create beta-latest --prerelease \
            --title "Aqua Guard Beta (última versión)" \
            --notes "Versión BETA. Cada archivo se actualiza en cuanto termina su compilación." || true
          gh release upload beta-latest "${files[@]}" --clobber
