<title>Reemplazador de caracteres</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=JetBrains+Mono:wght@500;700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
/* VOICE everyday tool
   IDEA a typesetter's swap tray: each rule is a pair of type blocks, old → new
   PICTURE the rule tiles themselves, then the live result
   COLOUR white ground, near-black ink, vermilion accent, pale vermilion tint
   TYPE Space Grotesk titles, Inter text, JetBrains Mono for characters
   LAYOUT step 1 rules, step 2 text; two columns of text on laptop, stacked on phone */
:root{color-scheme:light dark;--bg:light-dark(#ffffff,#121014);--ink:light-dark(#17151a,#f1eef2);--mute:light-dark(#615c66,#a7a1ad);--line:light-dark(#dcd8df,#38333d);--panel:light-dark(#f6f4f7,#1c1920);--acc:light-dark(#e8401c,#ff6a45);--tint:light-dark(#fde9e3,#3a1d16);--ok:light-dark(#11804a,#4fd18c)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.55 Inter,system-ui,sans-serif;overflow-x:clip}
.band{max-width:1100px;margin:0 auto;padding-block:clamp(24px,4vw,48px);padding-left:max(5vw,16px,env(safe-area-inset-left,0px));padding-right:max(5vw,16px,env(safe-area-inset-right,0px))}
h1{font:700 clamp(32px,6vw,48px)/1.05 "Space Grotesk",sans-serif;letter-spacing:-.02em;margin:0 0 8px}
h2{font:700 22px/1.2 "Space Grotesk",sans-serif;margin:0}
p{margin:0}
.sub{color:var(--mute);max-width:60ch}
.steps{display:flex;gap:8px;margin:24px 0 20px;flex-wrap:wrap}
.step{font:600 15px Inter,sans-serif;border:1px solid var(--line);background:none;color:var(--ink);padding:10px 16px;border-radius:999px;cursor:pointer;min-height:44px}
.step[aria-current=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.step b{font-family:"JetBrains Mono",monospace;margin-right:6px}
.head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.rules{display:grid;gap:10px}
.rule{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr) auto;gap:10px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px}
.rule input{width:100%;font:700 22px "JetBrains Mono",monospace;text-align:center;padding:10px 8px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink)}
.rule input:focus,textarea:focus{outline:2px solid var(--acc);outline-offset:1px;border-color:transparent}
.rule .to{color:var(--acc);font:700 22px "Space Grotesk",sans-serif}
.rule input.new{background:var(--tint)}
.x{width:44px;height:44px;border:0;background:none;color:var(--mute);font-size:22px;border-radius:10px;cursor:pointer}
.x:hover{background:var(--tint);color:var(--acc)}
.cap{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr) 44px;gap:10px;font-size:13px;color:var(--mute);padding:0 10px 4px}
.cap span{text-align:center}
.btn{font:600 15px Inter,sans-serif;min-height:44px;padding:10px 18px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer}
.btn:hover{border-color:var(--ink)}
.btn.main{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.main:hover{filter:brightness(1.08)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.presets{margin-top:28px}
.presets h3{font:600 15px Inter,sans-serif;margin:0 0 10px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font:500 14px Inter,sans-serif;border:1px dashed var(--line);background:none;color:var(--ink);padding:8px 14px;border-radius:999px;cursor:pointer;min-height:40px}
.chip:hover{border-color:var(--acc);color:var(--acc)}
.opts{display:flex;gap:18px;flex-wrap:wrap;margin:18px 0}
.opts label{display:flex;gap:8px;align-items:center;cursor:pointer}
.opts input{width:20px;height:20px;accent-color:var(--acc)}
.foot{margin-top:24px;padding-top:20px;border-top:1px solid var(--line);justify-content:space-between}
.empty{border:1px dashed var(--line);border-radius:14px;padding:24px;text-align:center;color:var(--mute)}
.summary{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px}
.pill{font:700 14px "JetBrains Mono",monospace;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:4px 10px;white-space:nowrap}
.pill i{font-style:normal;color:var(--acc);margin:0 4px}
.io{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
.box{display:flex;flex-direction:column;gap:8px}
.box label{font-weight:600}
textarea{width:100%;min-height:280px;resize:vertical;font:16px/1.6 Inter,sans-serif;padding:14px;border:1px solid var(--line);border-radius:14px;background:var(--bg);color:var(--ink)}
.out{white-space:pre-wrap;overflow-wrap:anywhere;min-height:280px;padding:14px;border:1px solid var(--line);border-radius:14px;background:var(--panel)}
.out mark{background:var(--tint);color:var(--acc);font-weight:700;border-radius:3px;padding:0 1px}
.out:empty::before{content:"El resultado aparecerá aquí.";color:var(--mute)}
.meta{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center;font-size:14px;color:var(--mute)}
.toast{color:var(--ok);font-weight:600}
@media(max-width:700px){.io{grid-template-columns:minmax(0,1fr)}textarea,.out{min-height:180px}.rule input{font-size:20px}.foot .btn.main{flex:1}}
</style>

<div class="band">
  <h1>Reemplazador de caracteres</h1>
  <p class="sub">Elige qué letras o símbolos cambiar y por cuáles. Después pega tu texto y copia el resultado.</p>

  <nav class="steps">
    <button class="step" id="tab1" aria-current="true"><b>1</b>Qué reemplazar</button>
    <button class="step" id="tab2" aria-current="false"><b>2</b>Tu texto</button>
  </nav>

  <section id="view1">
    <div class="head">
      <h2>Reglas de reemplazo</h2>
      <div class="row">
        <button class="btn" id="add">+ Añadir regla</button>
        <button class="btn" id="clear">Borrar todas</button>
      </div>
    </div>
    <div class="cap" id="cap"><span>Reemplazar</span><span></span><span>Por</span><span></span></div>
    <div class="rules" id="rules"></div>
    <div class="opts">
      <label><input type="checkbox" id="caseIns"> Ignorar mayúsculas y minúsculas</label>
      <label><input type="checkbox" id="hl" checked> Resaltar cambios</label>
    </div>
    <div class="presets">
      <h3>Atajos rápidos</h3>
      <div class="chips" id="chips"></div>
    </div>
    <div class="row foot">
      <span class="sub" id="count"></span>
      <button class="btn main" id="go">Continuar al texto →</button>
    </div>
  </section>

  <section id="view2" hidden>
    <div class="head">
      <h2>Escribe o pega tu texto</h2>
      <button class="btn" id="back">← Editar reglas</button>
    </div>
    <div class="summary" id="summary"></div>
    <div class="io">
      <div class="box">
        <label for="src">Texto original</label>
        <textarea id="src" placeholder="Escribe o pega aquí…">Hola, ¿qué tal? Esta es una prueba del reemplazador.
Cada letra «a» se cambia por «4» y cada «e» por «3».</textarea>
      </div>
      <div class="box">
        <label>Resultado</label>
        <div class="out" id="out" aria-live="polite"></div>
      </div>
    </div>
    <div class="meta" style="margin-top:12px">
      <span id="stats"></span>
      <div class="row">
        <span class="toast" id="toast"></span>
        <button class="btn" id="swap">Usar resultado como texto</button>
        <button class="btn main" id="copy">Copiar resultado</button>
      </div>
    </div>
  </section>
</div>

<script>
{
const $ = id => document.getElementById(id);
const PRESETS = [
  {n:'Estilo hacker (a→4, e→3…)', r:[['a','4'],['e','3'],['i','1'],['o','0'],['s','5'],['t','7']]},
  {n:'Quitar tildes', r:[['á','a'],['é','e'],['í','i'],['ó','o'],['ú','u'],['Á','A'],['É','E'],['Í','I'],['Ó','O'],['Ú','U'],['ü','u']]},
  {n:'Espacios → guion bajo', r:[[' ','_']]},
  {n:'Intercambiar a ↔ e', r:[['a','e'],['e','a']]},
  {n:'Comillas « » → " "', r:[['«','"'],['»','"']]},
  {n:'Puntos → comas', r:[['.',',']]},
];
let st = {rules:[['a','4'],['e','3']], ci:false, hl:true};
try { const s = JSON.parse(localStorage.getItem('reemplazador') || 'null'); if (s && Array.isArray(s.rules)) st = s; } catch(e) {}
const save = () => { try { localStorage.setItem('reemplazador', JSON.stringify(st)); } catch(e) {} };
const esc = s => s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const show = s => s === '' ? '∅' : s === ' ' ? '␣' : s;

function renderRules() {
  const R = $('rules');
  $('cap').hidden = !st.rules.length;
  R.innerHTML = st.rules.length ? st.rules.map((r,i) => `
    <div class="rule">
      <input data-i="${i}" data-k="0" value="${esc(r[0])}" aria-label="Reemplazar" placeholder="a">
      <span class="to">→</span>
      <input class="new" data-i="${i}" data-k="1" value="${esc(r[1])}" aria-label="Por" placeholder="vacío = borrar">
      <button class="x" data-del="${i}" aria-label="Eliminar regla">×</button>
    </div>`).join('') : '<div class="empty">No hay reglas. Añade una o elige un atajo.</div>';
  updateCount();
}
function updateCount() {
  const n = active().length;
  $('count').textContent = n === 1 ? '1 regla activa' : `${n} reglas activas`;
}
const active = () => st.rules.filter(r => r[0] !== '');

$('rules').addEventListener('input', e => {
  const t = e.target; if (!t.dataset.k) return;
  st.rules[+t.dataset.i][+t.dataset.k] = t.value; save(); updateCount();
});
$('rules').addEventListener('click', e => {
  const d = e.target.dataset.del; if (d === undefined) return;
  st.rules.splice(+d, 1); save(); renderRules();
});
$('add').onclick = () => { st.rules.push(['','']); save(); renderRules(); const ins = $('rules').querySelectorAll('input'); ins[ins.length-2]?.focus(); };
let clearArmed = false;
$('clear').onclick = () => {
  if (!clearArmed) { clearArmed = true; $('clear').textContent = '¿Seguro? Pulsa otra vez'; setTimeout(() => { clearArmed = false; $('clear').textContent = 'Borrar todas'; }, 2500); return; }
  clearArmed = false; $('clear').textContent = 'Borrar todas'; st.rules = []; save(); renderRules();
};
$('chips').innerHTML = PRESETS.map((p,i) => `<button class="chip" data-p="${i}">+ ${esc(p.n)}</button>`).join('');
$('chips').onclick = e => {
  const p = e.target.dataset.p; if (p === undefined) return;
  st.rules = st.rules.filter(r => r[0] !== '' || r[1] !== '');
  PRESETS[+p].r.forEach(([a,b]) => {
    const ex = st.rules.find(r => r[0] === a);
    if (ex) ex[1] = b; else st.rules.push([a,b]);
  });
  save(); renderRules();
};
$('caseIns').checked = st.ci; $('hl').checked = st.hl;
$('caseIns').onchange = e => { st.ci = e.target.checked; save(); };
$('hl').onchange = e => { st.hl = e.target.checked; save(); };

// Reemplazo en una sola pasada: permite intercambios (a↔e) y busca la coincidencia más larga
function replace(text) {
  const rules = active().slice().sort((a,b) => b[0].length - a[0].length);
  const norm = s => st.ci ? s.toLocaleLowerCase() : s;
  const keys = rules.map(r => norm(r[0]));
  let out = '', html = '', n = 0, i = 0;
  while (i < text.length) {
    let hit = -1;
    for (let k = 0; k < rules.length; k++) {
      if (norm(text.substr(i, rules[k][0].length)) === keys[k]) { hit = k; break; }
    }
    if (hit >= 0) {
      const v = rules[hit][1];
      out += v; html += v === '' ? '' : `<mark>${esc(v)}</mark>`; n++; i += rules[hit][0].length;
    } else { out += text[i]; html += esc(text[i]); i++; }
  }
  return {out, html, n};
}
let last = '';
function run() {
  const r = replace($('src').value);
  last = r.out;
  $('out').innerHTML = st.hl ? r.html : esc(r.out);
  $('stats').textContent = `${r.n} ${r.n === 1 ? 'cambio' : 'cambios'} · ${[...r.out].length} caracteres`;
}
$('src').addEventListener('input', run);

function go(v) {
  $('view1').hidden = v !== 1; $('view2').hidden = v !== 2;
  $('tab1').setAttribute('aria-current', v === 1); $('tab2').setAttribute('aria-current', v === 2);
  if (v === 2) {
    const a = active();
    $('summary').innerHTML = a.length ? a.map(r => `<span class="pill">${esc(show(r[0]))}<i>→</i>${esc(show(r[1]))}</span>`).join('') : '<span class="sub">Sin reglas: el texto no cambiará.</span>';
    run(); $('src').focus();
  }
}
$('tab1').onclick = $('back').onclick = () => go(1);
$('tab2').onclick = $('go').onclick = () => go(2);
window.volverAtras = () => { if (!$('view2').hidden) { go(1); return true; } return false; };

let tt;
const toast = m => { $('toast').textContent = m; clearTimeout(tt); tt = setTimeout(() => $('toast').textContent = '', 2200); };
$('copy').onclick = async () => {
  if (window.Android && window.Android.copy) { toast(window.Android.copy(last) ? '¡Copiado!' : 'No se pudo copiar'); return; }
  try { await navigator.clipboard.writeText(last); toast('¡Copiado!'); }
  catch (e) {
    const ta = document.createElement('textarea'); ta.value = last; document.body.appendChild(ta); ta.select();
    let ok = false; try { ok = document.execCommand('copy'); } catch (_) {}
    ta.remove(); toast(ok ? '¡Copiado!' : 'No se pudo copiar; selecciónalo a mano');
  }
};
$('swap').onclick = () => { $('src').value = last; run(); toast('Listo'); };

renderRules();
}
</script>
